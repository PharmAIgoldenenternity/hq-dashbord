<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>高质量信息仪表盘</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero card">
        <div>
          <p class="eyebrow">Personal Overview</p>
          <h1 id="site-title">高质量信息仪表盘</h1>
          <p id="site-subtitle" class="subtitle"></p>
        </div>
        <div class="hero-meta">
          <p id="current-date" class="date-text"></p>
          <button id="focus-mode-toggle" class="secondary-button" type="button">开启聚焦模式</button>
        </div>
      </header>

      <main class="dashboard-grid">
        <section class="card priorities-card">
          <div class="section-heading">
            <h2>今日重点</h2>
            <span class="section-hint">今天先完成最重要的事</span>
          </div>
          <ul id="priorities-list" class="priority-list"></ul>
        </section>

        <section class="card timer-card">
          <div class="section-heading">
            <h2>专注区</h2>
            <span class="section-hint">少一点漂移，多一点推进</span>
          </div>
          <div class="timer-panel">
            <p class="timer-label">当前专注倒计时</p>
            <div id="timer-display" class="timer-display">25:00</div>
            <div class="timer-actions">
              <button id="start-timer" class="primary-button" type="button">开始专注</button>
              <button id="reset-timer" class="secondary-button" type="button">重置</button>
            </div>
          </div>
          <div class="focus-note">
            <p id="focus-mantra"></p>
          </div>
        </section>

        <section class="card links-card full-width">
          <div class="section-heading">
            <h2>信息入口</h2>
            <span class="section-hint">把常用而重要的页面放在一个安静的入口里</span>
          </div>
          <div id="categories-grid" class="categories-grid"></div>
        </section>

        <section class="card tools-card">
          <div class="section-heading">
            <h2>常用入口</h2>
            <span class="section-hint">每天都会打开的固定页面</span>
          </div>
          <div id="tools-grid" class="tools-grid"></div>
        </section>

        <section class="card reminders-card">
          <div class="section-heading">
            <h2>提醒</h2>
            <span class="section-hint">在进入下一个页面前，先回到重点</span>
          </div>
          <ul id="reminders-list" class="reminders-list"></ul>
        </section>

        <section class="card editor-help-card full-width">
          <div class="section-heading">
            <h2>如何继续调整这个页面</h2>
            <span class="section-hint">给未来的自己留一个简单入口</span>
          </div>
          <div id="editor-help-content" class="editor-help-content"></div>
        </section>
      </main>
    </div>

    <script src="./data/site-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
